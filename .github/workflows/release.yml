# Every push and pull request runs the Lua 5.1 syntax check and the offline tests.
# A version tag (v0.2.0, v0.3.0-beta1, ...) also publishes a release, but only if the tests pass:
# the BigWigs packager builds the zip, names the flavor "forever" in release.json from Interface 16001,
# and attaches both to a GitHub release; WowUp installs and updates from those two files.
name: Test and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Syntax check
        run: for f in *.lua tests/*.lua; do luac5.1 -p "$f"; done

      - name: Offline tests
        run: lua5.1 tests/run.lua

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
